[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
repository = "https://github.com/Kseen715/kerasi-strings"

[workspace.dependencies]
strings-core = { path = "crates/strings-core" }
strings-wasm = { path = "crates/strings-wasm" }
data-encoding = { version = "2.11", default-features = false, features = [
    "alloc",
] }
md-5 = { version = "0.11", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2 = { version = "0.11", default-features = false }
unicode_names2 = { version = "1.3", default-features = false }
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0", default-features = false, features = [
    "std",
] }
wasm-bindgen = "0.2.129"
wasm-bindgen-test = "0.3.79"
proptest = "1.12"

# Small over fast: the WASM is downloaded on every first visit
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
