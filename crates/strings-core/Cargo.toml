[package]
name = "strings-core"
description = "Every string operation of Kerasi Strings, in pure Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
data-encoding.workspace = true
md-5.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
unicode_names2 = { workspace = true, optional = true }

[features]
# The Unicode name table for `\N{...}` escapes: about 400 KB gzipped, so
# only the engine the browser loads on demand has it
names = ["dep:unicode_names2"]

[dev-dependencies]
proptest.workspace = true
